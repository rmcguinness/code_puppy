# Generated Go is committed (internal/gen), so `go install` and the
# reproducible build need no generator. The plugins are pinned in
# tools/go.mod and run through `go tool`.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/retail-cortex/code_puppy/internal/gen
plugins:
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "-modfile=tools/go.mod", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
