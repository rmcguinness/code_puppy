name: go-ci

on:
  push:
    branches: [main]
    paths: ["go/**", ".github/workflows/go-*.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go-*.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Linux runs the real bubblewrap sandbox tests.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # gVisor runs skill scripts on Linux; pinned release and checksum.
      - name: Install gVisor (runsc)
        if: runner.os == 'Linux'
        env:
          GVISOR_RELEASE: "20260921.0"
          GVISOR_SHA512: 7c899979bed334f0987888c41e545cede8e1f7e67a257978c8de244c3867e32bc30d08491e9af36720273c502acd01d8d86c9844ebcbe125790c43fe6bdf563e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gvisor.tar.bz2 "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  gvisor.tar.bz2" | sha512sum -c -
          mkdir -p gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          echo "RUNSC_PATH=$RUNNER_TEMP/gvisor/runsc" >> "$GITHUB_ENV"
      # Fails when gofmt lists a file. (`… | (! read)` fails under macOS's
      # bash 3.2 with -e even when nothing is listed.)
      - run: test -z "$(gofmt -l cmd pkg | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Sandbox enforcement must not be skipped
        run: go test -count=1 -v -run TestOSSandboxEnforcement ./pkg/tools/ | tee out.txt && ! grep -q -- '--- SKIP' out.txt
      - name: gVisor script sandbox must not be skipped
        if: runner.os == 'Linux'
        run: go test -count=1 -v -run 'TestGVisor' ./pkg/tools/ | tee gv.txt && ! grep -q -- '--- SKIP' gv.txt
      - run: make cross-compile
