name: ci

# Documentation-only changes don't need a build.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".agents/**", "docs/**", "LICENSE", "NOTICE"]
  pull_request:
    paths-ignore: ["**.md", ".agents/**", "docs/**", "LICENSE", "NOTICE"]

# Use exactly the Go version setup-go installs from go.mod; never download another.
env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # buf breaking compares with the previous commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Linux runs the real bubblewrap sandbox tests.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # gVisor runs skill scripts on Linux; pinned release and checksum.
      - name: Install gVisor (runsc)
        if: runner.os == 'Linux'
        env:
          GVISOR_RELEASE: "20260921.0"
          GVISOR_SHA512: 7c899979bed334f0987888c41e545cede8e1f7e67a257978c8de244c3867e32bc30d08491e9af36720273c502acd01d8d86c9844ebcbe125790c43fe6bdf563e
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gvisor.tar.bz2 "https://storage.googleapis.com/gvisor/releases/release/${GVISOR_RELEASE}/x86_64/gvisor.tar.bz2"
          echo "${GVISOR_SHA512}  gvisor.tar.bz2" | sha512sum -c -
          mkdir -p gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          echo "RUNSC_PATH=$RUNNER_TEMP/gvisor/runsc" >> "$GITHUB_ENV"
      # Fails when gofmt lists a file. (`… | (! read)` fails under macOS's
      # bash 3.2 with -e even when nothing is listed.)
      - run: test -z "$(gofmt -l cmd internal | tee /dev/stderr)"
      - run: go vet ./...
      # The API protos: lint, formatting, generated code current, and no
      # breaking change against the previous commit (once it had protos).
      - name: Protos
        if: runner.os == 'Linux'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          make proto-check
          if git cat-file -e "$BASE:buf.yaml" 2>/dev/null; then
            go tool -modfile=tools/go.mod buf breaking --against ".git#ref=$BASE"
          fi
      - run: go test -race ./...
      - name: Sandbox enforcement must not be skipped
        run: go test -count=1 -v -run TestOSSandboxEnforcement ./internal/tools/ | tee out.txt && ! grep -q -- '--- SKIP' out.txt
      - name: gVisor script sandbox must not be skipped
        if: runner.os == 'Linux'
        run: go test -count=1 -v -run 'TestGVisor' ./internal/tools/ | tee gv.txt && ! grep -q -- '--- SKIP' gv.txt
      - run: make cross-compile
      # The reproducible job compares these across runners.
      - run: (cd bin && shasum -a 256 code-puppy-*) > sums-${{ runner.os }}.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sums-${{ runner.os }}
          path: sums-${{ runner.os }}.txt

  # Every target, cross-compiled on Linux and on macOS, must come out
  # byte-for-byte identical: the build may not depend on the host.
  reproducible:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sums-*
          merge-multiple: true
      - run: diff sums-Linux.txt sums-macOS.txt
