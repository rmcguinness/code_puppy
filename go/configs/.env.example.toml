# Code Puppy Configuration File (.env.toml)
# Managed and resolved via retail-cortex/modenv
# A minimal example. `code-puppy config init` writes the full, commented
# template (sandbox, UI, log, telemetry, web, MCP, hooks, pricing, ...).

[code_puppy]
puppy_name = "Code Puppy"
owner_name = "Developer"
default_agent = "code-puppy"
default_model = "gemini-3.8-flash"
agency_level = "high" # "low", "medium", "high", "extreme"
temperature = 0.2
max_tokens = 8192
auto_approve = false

[llm]
provider = "gemini" # Options: "gemini", "openai", "anthropic", "ollama"
max_retries = 3               # rate limits, overload, 5xx, dropped connections
stall_timeout_seconds = 600   # fail a request that sends nothing for this long
# fallback_models = ["anthropic/claude-sonnet-5"]   # tried in order when the model fails

[llm.gemini]
# Secrets can be plaintext, env var references, or decrypted via modenv:
# api_key = "cloud://GEMINI_API_KEY" or "pks://..." or direct key
api_key = ""
model = "gemini-3.8-flash"
# project_id = "my-gcp-project"
# location = "us-central1"

[llm.openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o"

[llm.anthropic]
api_key = ""
model = "claude-3-7-sonnet-20250219"

[skills]
enabled = true
paths = [
    "~/.code_puppy/skills",
    "./skills",
    ".agents/skills"
]

[tools]
shell_timeout_seconds = 120
max_file_size_bytes = 10485760 # 10MB
workspace_dir = "."
auto_approve_commands = false
max_parallel = 8   # tool calls from one model response run at once

[session]
storage_dir = "~/.code_puppy/sessions"
auto_save = true

# [agent_models]   # run agents on their own model (/pin_model, /unpin)
# qa-kitten = "anthropic/claude-haiku-4-5"
